name: StudyHub Minimal Runtime Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    if: github.head_ref == 'release/public-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: release/public-hardening

      - name: Replace compat boundary with minimal core and hooks
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''<script type="importmap">
          {
            "imports": {
              "react": "https://esm.sh/preact@10.29.8/compat",
              "react-dom/client": "https://esm.sh/preact@10.29.8/compat/client"
            }
          }
          </script>
          <script type="module">
          import * as React from "react";
          import { createRoot } from "react-dom/client";
          const ReactDOM={createRoot};
          "use strict";
          '''.replace('          ', '')
          new = '''<script type="module">
          import { createElement, Fragment, render } from "https://esm.sh/preact@10.29.8?target=es2022";
          import { useState, useEffect, useCallback, useRef, useMemo } from "https://esm.sh/preact@10.29.8/hooks?target=es2022";
          const React={createElement,StrictMode:Fragment,useState,useEffect,useCallback,useRef,useMemo};
          const ReactDOM={createRoot:(node)=>({render:(vnode)=>render(vnode,node)})};
          "use strict";
          '''.replace('          ', '')
          if text.count(new) == 1 and text.count(old) == 0:
              print('Minimal runtime already applied.')
          elif text.count(old) == 1 and text.count(new) == 0:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied minimal Preact core/hooks runtime.')
          else:
              raise SystemExit(f'Minimal runtime assertion failed: old={text.count(old)}, new={text.count(new)}')

      - name: Commit minimal runtime when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: use minimal Preact core runtime"
          git push origin HEAD:release/public-hardening
