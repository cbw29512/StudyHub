name: StudyHub Runtime Compat Swap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    if: github.head_ref == 'release/public-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: release/public-hardening

      - name: Apply exact React to Preact compat boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
          <script>
          "use strict";
          '''.replace('          ', '')
          new = '''<script type="importmap">
          {
            "imports": {
              "react": "https://esm.sh/preact@10.29.8/compat",
              "react-dom/client": "https://esm.sh/preact@10.29.8/compat/client"
            }
          }
          </script>
          <script type="module">
          import * as React from "react";
          import { createRoot } from "react-dom/client";
          const ReactDOM={createRoot};
          "use strict";
          '''.replace('          ', '')
          if text.count(new) == 1 and text.count(old) == 0:
              print('Runtime compat boundary already applied.')
          elif text.count(old) == 1 and text.count(new) == 0:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied exact runtime compat boundary.')
          else:
              raise SystemExit(f'Runtime boundary assertion failed: old={text.count(old)}, new={text.count(new)}')

      - name: Commit runtime boundary when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No runtime boundary change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: replace React UMD boot with Preact compat"
          git push origin HEAD:release/public-hardening
