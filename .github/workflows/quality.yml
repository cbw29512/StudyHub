name: StudyHub Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Vendor pinned Preact runtime on hardening branch
        if: github.event_name == 'pull_request' && github.head_ref == 'release/public-hardening' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'https://esm.sh/preact@10.29.8' index.html; then
            rm -rf /tmp/studyhub-preact node_modules package-lock.json package.json
            npm init -y >/dev/null
            npm install --ignore-scripts --no-save preact@10.29.8
            mkdir -p vendor
            cp node_modules/preact/dist/preact.mjs vendor/preact.mjs
            cp node_modules/preact/hooks/dist/hooks.mjs vendor/hooks.mjs
            cp node_modules/preact/LICENSE vendor/PREACT-LICENSE.txt
            python - <<'PY'
          from pathlib import Path

          hooks = Path('vendor/hooks.mjs')
          source = hooks.read_text(encoding='utf-8')
          old = 'from"preact"'
          if old not in source:
              raise SystemExit('Pinned hooks module no longer imports expected bare preact specifier')
          hooks.write_text(source.replace(old, 'from"./preact.mjs"', 1), encoding='utf-8')

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          replacements = {
              'from "https://esm.sh/preact@10.29.8?target=es2022"': 'from "./vendor/preact.mjs"',
              'from "https://esm.sh/preact@10.29.8/hooks?target=es2022"': 'from "./vendor/hooks.mjs"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one import to replace: {old}')
              text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')
          PY
            rm -rf node_modules package-lock.json package.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html vendor
            git commit -m 'perf: vendor pinned Preact runtime locally'
            git push origin HEAD:release/public-hardening
          else
            test -f vendor/preact.mjs
            test -f vendor/hooks.mjs
            test -f vendor/PREACT-LICENSE.txt
            grep -q 'from "./vendor/preact.mjs"' index.html
            grep -q 'from "./vendor/hooks.mjs"' index.html
            echo 'Pinned Preact runtime already vendored.'
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local links and static assets
        run: python scripts/validate_site.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install accessibility and Lighthouse tooling
        run: npm install --global pa11y-ci lighthouse http-server

      - name: Start static server
        run: |
          http-server . -p 4173 -c-1 > /tmp/studyhub-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studyhub-http.log
          exit 1

      - name: WCAG accessibility scan
        run: pa11y-ci --config .pa11yci.json

      - name: Mobile Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/index.html \
            --quiet \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=mobile-lighthouse.json

      - name: Desktop Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/index.html \
            --quiet \
            --preset=desktop \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=desktop-lighthouse.json

      - name: Require Lighthouse 100/100/100/100
        run: python scripts/assert_lighthouse.py mobile-lighthouse.json desktop-lighthouse.json

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: '*-lighthouse.json'
          if-no-files-found: ignore
