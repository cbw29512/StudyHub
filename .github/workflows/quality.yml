name: StudyHub Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply first-paint shell on hardening branch
        if: github.event_name == 'pull_request' && github.head_ref == 'release/public-hardening' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div id="root"></div>'
          new = '''<div id="root"><div aria-hidden="true"><nav class="app-nav"><div class="nav-inner"><span class="nav-btn active"><span class="nav-icon">📊</span><span class="nav-label"> Dashboard</span></span><span class="nav-btn"><span class="nav-icon">🃏</span><span class="nav-label"> Cards</span></span><span class="nav-btn"><span class="nav-icon">📝</span><span class="nav-label"> Vlog</span></span></div></nav><main class="app-main"><div class="mb-24"><h1 class="fw-8 text-4xl">Study Hub <span class="pill" style="vertical-align:middle">v4.1.0</span></h1><p class="text-base o-60 mt-6">Your local-first certification study workspace.</p></div><div class="stats-row mb-16"><div class="card stat-card"><div class="stat-icon">🔥</div><div><div class="stat-label">Streak</div><div class="stat-value">0 days</div></div></div><div class="card stat-card"><div class="stat-icon">⏱️</div><div><div class="stat-label">Today</div><div class="stat-value">0 min</div></div></div><div class="card stat-card"><div class="stat-icon">📊</div><div><div class="stat-label">This Week</div><div class="stat-value">0 min</div></div></div></div><div class="card mb-16" style="min-height:141px"><div class="card-header"><h2 class="card-title">Weekly Activity</h2></div></div></main></div></div>'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Expected exactly one empty root')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Homepage root does not match expected pre- or post-patch state')
          PY
          if git diff --quiet -- index.html; then
            echo 'First-paint shell already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'perf: paint dashboard shell before Preact loads'
            git push origin HEAD:release/public-hardening
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local links and static assets
        run: python scripts/validate_site.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install accessibility and Lighthouse tooling
        run: npm install --global pa11y-ci lighthouse http-server

      - name: Start static server
        run: |
          http-server . -p 4173 -c-1 > /tmp/studyhub-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studyhub-http.log
          exit 1

      - name: WCAG accessibility scan
        run: pa11y-ci --config .pa11yci.json

      - name: Mobile Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/index.html \
            --quiet \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=mobile-lighthouse.json

      - name: Desktop Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/index.html \
            --quiet \
            --preset=desktop \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=desktop-lighthouse.json

      - name: Require Lighthouse 100/100/100/100
        run: python scripts/assert_lighthouse.py mobile-lighthouse.json desktop-lighthouse.json

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: '*-lighthouse.json'
          if-no-files-found: ignore
